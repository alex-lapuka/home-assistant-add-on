name: "Twingate Gateway"
version: "0.1.0"
slug: "twingate-gateway"
description: >-
  Twingate Gateway in Web App mode: injects HTTP request headers into
  requests for a Twingate Web App Resource
arch:
  - aarch64
  - amd64
init: false
stage: experimental
ports:
  8443/tcp: 8443
ports_description:
  8443/tcp: "Gateway TLS listener that the Twingate Connector forwards Web App connections to"
map:
  - type: ssl
    read_only: true
  - type: addon_config
    read_only: false
options:
  log_level: info
  request_headers: []
  certificate_ip_addresses: []
  audit_log: addon_log
schema:
  network: str
  log_level: list(debug|info|warn|error)
  request_headers:
    - name: str
      value: password
  certificate_ip_addresses:
    - str
  audit_log: list(addon_log|file)
  custom_ca_certfile: str?
  custom_ca_keyfile: str?
