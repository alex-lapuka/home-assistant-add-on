configuration:
  network:
    name: Twingate network
    description: >-
      Your Twingate network name, the first part of your Admin Console
      address (for example acme for acme.twingate.com). Use the same value as
      in the Twingate Connector add-on.
  log_level:
    name: Log level
    description: >-
      Level of the Gateway's system log. It does not change the audit log.
  read_groups:
    name: Read groups
    description: >-
      Twingate groups whose members may read Home Assistant through the API
      proxy (states, registries, history; REST and WebSocket), but not act
      or render templates. Empty: everyone with access to the Resource may
      read. Once a group is named here, callers in none of the three group
      lists get no access. Group names must match exactly.
  mcp_groups:
    name: MCP groups
    description: >-
      Twingate groups whose members may use the Model Context Protocol
      endpoint /api/mcp through the API proxy. What they can do there is set
      in Home Assistant's MCP Server settings; with their defaults, any action
      on any entity. Empty: nobody.
  full_groups:
    name: Full access groups
    description: >-
      Twingate groups whose members may use the whole Home Assistant API
      through the API proxy, except direct routes into the Supervisor and
      the host, account and token management and backups, which are blocked
      for everyone. Includes Read and MCP. Not a security boundary: blocked
      actions remain reachable indirectly, for example through automations.
      Empty: nobody.
  request_headers:
    name: Request headers
    description: >-
      Optional, for the setup without the API proxy. HTTP headers that the
      Gateway adds to every request it forwards, for every Web App Resource
      that uses this Gateway. A header with the same name sent by the client
      is replaced. For Home Assistant on port 8123, add the name
      Authorization with the value Bearer, a space and a long-lived access
      token. Values are never logged.
    fields:
      name:
        name: Header name
        description: >-
          The HTTP header name, for example Authorization. The add-on sets
          X-Twingate-Gateway-Token itself.
      value:
        name: Header value
        description: >-
          A static value, or text with one Gateway placeholder (see the
          Documentation tab).
  certificate_ip_addresses:
    name: Certificate IP addresses
    description: >-
      IPv4 addresses for which the add-on issues a TLS certificate, for
      clients that reach a Resource on this Gateway by IP address instead of
      by alias. IPv6 is not supported. Leave empty when clients use an alias.
  audit_log:
    name: Audit log
    description: >-
      Where the Gateway writes its audit log of every request: the add-on log
      (addon_log) or audit.log in this add-on's configuration folder under
      addon_configs (file). The audit log includes the request headers sent
      by clients.
  custom_ca_certfile:
    name: Custom CA certificate file
    description: >-
      Optional. A PEM CA certificate in the Home Assistant ssl folder, for
      example twingate/ca.crt, to use instead of the CA created by the
      add-on. Set together with the custom CA private key file.
  custom_ca_keyfile:
    name: Custom CA private key file
    description: >-
      Optional. The unencrypted PEM private key of the custom CA certificate,
      in the Home Assistant ssl folder, for example twingate/ca.key.
network:
  8443/tcp: >-
    Gateway TLS listener that the Twingate Connector forwards Web App
    connections to. With the Twingate Connector add-on on this Home
    Assistant, the Gateway address in Twingate is the add-on's host name and
    port 8443 (shown in the Web UI). For a Connector elsewhere, register the
    Home Assistant IP address and this port instead.
  8124/tcp: >-
    Home Assistant API proxy. Leave it empty when the Twingate Resource uses
    the add-on's host name (recommended). Set a port only if the Resource
    uses the Home Assistant host's IP address; the proxy is then reachable
    from your LAN, with a Twingate token only.
