name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "twingate-gateway/**"
      - ".github/workflows/tests.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "twingate-gateway/**"
      - ".github/workflows/tests.yaml"

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests of the Twingate Gateway add-on
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5.0.0

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          # The Python of the add-on image (Alpine 3.24).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: twingate-gateway/tests/requirements.txt

      - name: Install aiohttp and cryptography
        run: python -m pip install --disable-pip-version-check -r twingate-gateway/tests/requirements.txt

      - name: Run the unit tests
        run: python -m unittest discover --start-directory twingate-gateway/tests --verbose
